---
# ==========================================
# CONFIGURACIÓN COMÚN (Variables de Entorno)
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: logiflow-config
  namespace: logiflow
data:
  NODE_ENV: "production"
  DB_HOST: "postgres-service"
  RABBITMQ_HOST: "rabbitmq-service"

---
# ==========================================
# MICROSERVICIOS (Backend)
# ==========================================

# --- Auth Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: logiflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: micaelasalcedo/authservice:latest
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: logiflow-config
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://authservice-db:5432/jwt_demo"
        - name: SPRING_DATASOURCE_USERNAME
          value: "admin"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "admin"
        - name: JWT_SECRET
          value: "MiSuperClaveSecretaMuyLarga123456789"
        - name: JWT_ISSUER
          value: "auth-service"
---
apiVersion: v1
kind: Service
metadata:
  name: authservice
  namespace: logiflow
spec:
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081

---
# --- Billing Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: logiflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
      - name: billing-service
        image: micaelasalcedo/billing-service:latest
        ports:
        - containerPort: 8082
        envFrom:
        - configMapRef:
            name: logiflow-config
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://billing-db:5432/db_billing_users"
        - name: SPRING_DATASOURCE_USERNAME
          value: "billing"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "qwerty123"
        - name: JWT_SECRET
          value: "MiSuperClaveSecretaMuyLarga123456789"
        - name: JWT_ISSUER
          value: "auth-service"
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: logiflow
spec:
  selector:
    app: billing-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082

---
